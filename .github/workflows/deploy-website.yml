name: Deploy Website to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/website/**'
      - '.github/workflows/deploy-website.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '26'

      - name: Build website
        run: pnpm --filter @sammons/website build

      # wrangler is a deploy-time tool, not part of the app, so it is installed
      # into a scratch directory rather than carried as a dependency, pinned to
      # an exact version.
      #
      # Its esbuild/workerd install scripts stay unrun (--ignore-scripts): they
      # are only needed for Workers bundling, which a static Pages upload never
      # touches. Verified end to end -- both `wrangler --version` and
      # `pages deploy` work with those scripts ignored.
      #
      # `pnpm dlx` cannot be used here: it fails with ERR_PNPM_IGNORED_BUILDS.
      - name: Install wrangler
        run: |
          mkdir -p "$RUNNER_TEMP/wrangler"
          cd "$RUNNER_TEMP/wrangler"
          echo '{"name":"wrangler-runner","private":true}' > package.json
          pnpm add --ignore-scripts wrangler@4.127.1
          ./node_modules/.bin/wrangler --version

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" pages deploy \
            packages/website/dist \
            --project-name=code-outline \
            --branch=main
