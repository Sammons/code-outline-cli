name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_OPTIONS: '--max-old-space-size=4096'

# Cancel previous runs for the same PR/branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# This workflow targets Gitea Actions (act_runner), which presents itself as GHES.
# Artifact upload/download (@actions/artifact v2+) and github/codeql-action both
# call github.com-only backend services and fail hard there, so jobs are
# self-contained: each one builds what it needs instead of receiving a handoff.
jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '26'

      - name: Cache build outputs
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist/
            packages/*/lib/
            node_modules/.cache/
          key: build-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('packages/*/src/**') }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            build-${{ runner.os }}-

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Test CLI functionality
        run: |
          if [ ! -f "packages/cli/dist/cli.js" ]; then
            echo "ERROR: CLI not built successfully"
            exit 1
          fi
          echo "Testing CLI functionality..."
          cd packages/cli
          node dist/cli.js --version
          node dist/cli.js --help
          node dist/cli.js "../../packages/parser/src/**/*.ts" --format json --depth 1 > /tmp/test-output.json
          echo "CLI test completed"

      - name: Generate documentation data
        run: |
          echo "Checking if documentation needs generation..."
          pnpm docs:check || {
            echo "Generating documentation data..."
            pnpm docs:update || {
              echo "Documentation generation failed, continuing with existing data"
            }
          }

      - name: Validate generated documentation
        run: pnpm docs:validate || true

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '26'

      - name: Check formatting
        run: pnpm exec prettier --check "**/*.{ts,tsx,js,jsx,json,md,yaml,yml}"

      - name: Run linter
        run: pnpm exec eslint .

      - name: Type check
        run: pnpm exec tsc --noEmit

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '26'

      - name: Run security audit
        run: pnpm audit --audit-level moderate
        continue-on-error: true # Advisory only; does not gate the merge
