name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # Don't cancel releases

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write
  issues: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Use RELEASE_TOKEN if available, otherwise GITHUB_TOKEN
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '26'

      - name: Verify npm token is configured
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN is not set on this repo. Set it with:"
            echo "  pnpm gitea-admin secrets set --repo sammons/code-outline-cli --name NPM_TOKEN --value-file <path>"
            exit 1
          fi

      - name: Configure npm registry
        run: pnpm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}

      - name: Build packages
        run: pnpm build

      # `changesets/action` is deliberately NOT used here. Its job is to open a
      # "Version Packages" PR through the GitHub API, which is the one piece
      # with no verified Gitea equivalent. `changeset version` and
      # `changeset publish` are plain CLI calls that need no forge API at all,
      # so the version bump is committed directly and the publish runs from it.
      - name: Apply pending changesets
        id: version
        run: |
          if [ -z "$(ls .changeset/*.md 2>/dev/null | grep -v README)" ]; then
            echo "No pending changesets; nothing to release."
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          pnpm version-packages

      - name: Commit the version bump
        if: steps.version.outputs.has_changesets == 'true'
        run: |
          git config user.name 'gitea-actions'
          git config user.email 'gitea-actions@sammons.io'
          git add -A
          git commit -m 'chore: release packages'
          git push origin HEAD:main

      - name: Publish to npm
        if: steps.version.outputs.has_changesets == 'true'
        run: pnpm release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
